name: CI/CD & Verification Pull Request (UASZ Microservices)

on:
  push:
    branches:
      - main
      - develop
      - test
      - deploy
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
      - test
      - deploy

jobs:
  # =========================================================================
  # 0. CONTRÔLE DU FLUX DE PULL REQUEST (develop -> test -> deploy -> main)
  # =========================================================================
  pr-branch-policy:
    name: Vérification de la politique de branches (PR Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Vérification de la branche source et de la branche cible
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"
          echo "Pull Request détectée : $SOURCE -> $TARGET"

          if [ "$TARGET" = "test" ] && [ "$SOURCE" != "develop" ]; then
            echo "::warning::Recommandation : la branche 'test' reçoit normalement les PR depuis 'develop' (reçu depuis '$SOURCE')."
          fi
          if [ "$TARGET" = "deploy" ] && [ "$SOURCE" != "test" ] && [ "$SOURCE" != "develop" ]; then
            echo "::warning::Recommandation : la branche 'deploy' reçoit normalement les PR depuis 'test' (reçu depuis '$SOURCE')."
          fi
          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "deploy" ] && [ "$SOURCE" != "test" ] && [ "$SOURCE" != "develop" ]; then
            echo "::warning::Recommandation : la branche 'main' reçoit normalement les PR validées depuis 'deploy' ou 'test'."
          fi

  # =========================================================================
  # 1. INTÉGRATION CONTINUE : Compilation & Tests Unitaires (9 services)
  #    S'exécute sur TOUS les push ET TOUTES les Pull Requests
  # =========================================================================
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - ms-patrimoine
          - ms-circuit
          - ms-evenement
          - ms-reservation
          - ms-utilisateur
          - ms-notification
          - ms-paiement
          - api-gateway

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Java 21 (Eclipse Temurin) et cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilation, MapStruct et Tests unitaires (${{ matrix.service }})
        working-directory: ./${{ matrix.service }}
        run: |
          export SECURITY_SESSION_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export SECURITY_INTERSERVICE_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          chmod +x ./mvnw
          ./mvnw -B clean test package

      - name: Conservation de l'artefact JAR (${{ matrix.service }})
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  # =========================================================================
  # 2. TEST D'INTÉGRATION INTER-MICROSERVICES (OpenFeign, RestTemplate, WebClient)
  #    S'exécute sur PR ET sur push (develop, test, deploy, main)
  # =========================================================================
  integration-e2e:
    name: Test d'Intégration E2E Inter-Microservices
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Téléchargement des JARs compilés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Démarrage et tests E2E durcis (ms-patrimoine, ms-circuit, ms-evenement, ms-reservation)
        run: |
          set -e
          set -u
          set -o pipefail

          export SECURITY_SESSION_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          export SECURITY_INTERSERVICE_SECRET="$(openssl rand -base64 48 | tr -d '\n')"

          PIDS=()
          CLEANED_UP=0

          cleanup() {
            local EXIT_CODE=$?
            if [ "$CLEANED_UP" -eq 1 ]; then
              return
            fi
            CLEANED_UP=1
            echo -e "\n>>> [CLEANUP] Nettoyage et arrêt des microservices..."
            for pid in "${PIDS[@]}"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                echo "Arrêt du processus PID $pid..."
                kill "$pid" 2>/dev/null || true
              fi
            done
            sleep 1
            for pid in "${PIDS[@]}"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill -9 "$pid" 2>/dev/null || true
              fi
            done
            exit "$EXIT_CODE"
          }

          trap cleanup EXIT INT TERM

          dump_diagnostics() {
            local FAILED_STEP="$1"
            echo "=================================================================="
            echo " [DIAGNOSTIC AUTOMATIQUE] Échec lors de : $FAILED_STEP"
            echo "=================================================================="
            echo ">>> État des processus :"
            for s in "ms-patrimoine:${PID_PATRIMOINE:-}:3001" "ms-circuit:${PID_CIRCUIT:-}:3002" "ms-evenement:${PID_EVENEMENT:-}:3003" "ms-reservation:${PID_RESERVATION:-}:3004"; do
              NAME="${s%%:*}"
              REST="${s#*:}"
              PID="${REST%%:*}"
              PORT="${REST#*:}"
              if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
                echo "  - $NAME (PID $PID, Port $PORT) : EN COURS D'EXÉCUTION"
              else
                echo "  - $NAME (PID ${PID:-N/A}, Port $PORT) : ARRÊTÉ / CRASHÉ"
              fi
            done

            echo -e "\n>>> Réponses Actuator /health :"
            for port in 3001 3002 3003 3004; do
              echo "  Port $port :"
              curl -s "http://localhost:$port/actuator/health" || echo "  [Inaccessible]"
            done

            echo -e "\n>>> Dernières lignes des journaux applicatifs :"
            for logf in patrimoine.log circuit.log evenement.log reservation.log; do
              echo "--- Journal : $logf ---"
              if [ -f "$logf" ]; then
                tail -n 35 "$logf"
              else
                echo "[Fichier introuvable]"
              fi
            done
            echo "=================================================================="
          }

          wait_for_service() {
            local NAME="$1"
            local PORT="$2"
            local PID="$3"
            local MAX_ATTEMPTS=30
            local SLEEP_SEC=2

            echo "Attente de disponibilité de $NAME (: $PORT, PID: $PID)..."
            for ((i=1; i<=MAX_ATTEMPTS; i++)); do
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "[ERREUR CRITIQUE] Le processus $NAME (PID $PID) s'est arrêté inopinément !" >&2
                dump_diagnostics "Démarrage de $NAME"
                return 1
              fi

              local HEALTH_STATUS
              HEALTH_STATUS=$(curl -sf "http://localhost:$PORT/actuator/health" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)
              if [ "$HEALTH_STATUS" = "UP" ]; then
                echo ">>> $NAME est opérationnel (status: UP) après ${i} tentative(s)."
                return 0
              fi

              sleep "$SLEEP_SEC"
            done

            echo "[TIMEOUT] $NAME (: $PORT) n'a pas atteint le statut UP après $((MAX_ATTEMPTS * SLEEP_SEC))s." >&2
            dump_diagnostics "Timeout démarrage de $NAME"
            return 1
          }

          find_jar() {
            local SVC="$1"
            if [ -f "artifacts/jar-$SVC/$SVC-0.0.1-SNAPSHOT.jar" ]; then
              echo "artifacts/jar-$SVC/$SVC-0.0.1-SNAPSHOT.jar"
            elif [ -f "$SVC/target/$SVC-0.0.1-SNAPSHOT.jar" ]; then
              echo "$SVC/target/$SVC-0.0.1-SNAPSHOT.jar"
            else
              echo ""
            fi
          }

          # Fonction utilitaire exécutant un appel HTTP muni d'une enveloppe Gateway signée HMAC-SHA256
          gateway_signed_curl() {
            local METHOD="$1"
            local URL="$2"
            local PATH_URI="$3"
            local USER_ID="$4"
            local USER_ROLES="$5"
            local USER_PERMS="$6"
            local USER_EMAIL="$7"
            local BODY="$8"
            local OUT_FILE="$9"

            local TS
            TS=$(date +%s)
            local NONCE
            NONCE=$(cat /proc/sys/kernel/random/uuid)
            local SESSION_ID="ci-session-e2e"
            local BODY_SHA256
            BODY_SHA256=$(printf '%s' "$BODY" | sha256sum | awk '{print $1}')

            local CANONICAL="${METHOD}|${PATH_URI}|${USER_ID}|${USER_ROLES}|${USER_PERMS}|${USER_EMAIL}|${SESSION_ID}|${TS}|${NONCE}|${BODY_SHA256}"
            local SIG
            SIG=$(printf '%s' "$CANONICAL" | openssl dgst -sha256 -hmac "$SECURITY_SESSION_SECRET" -binary | base64 | tr '+/' '-_' | tr -d '=\n\r')
            local GW_TOKEN="${TS}.${NONCE}.${SIG}"

            if [ -n "$BODY" ]; then
              curl -s -w "%{http_code}" -X "$METHOD" "$URL" \
                -H "Content-Type: application/json" \
                -H "X-User-Id: $USER_ID" \
                -H "X-User-Roles: $USER_ROLES" \
                -H "X-User-Permissions: $USER_PERMS" \
                -H "X-User-Email: $USER_EMAIL" \
                -H "X-User-Session-Id: $SESSION_ID" \
                -H "X-Content-SHA256: $BODY_SHA256" \
                -H "X-Internal-Gateway-Token: $GW_TOKEN" \
                -d "$BODY" \
                -o "$OUT_FILE"
            else
              curl -s -w "%{http_code}" -X "$METHOD" "$URL" \
                -H "X-User-Id: $USER_ID" \
                -H "X-User-Roles: $USER_ROLES" \
                -H "X-User-Permissions: $USER_PERMS" \
                -H "X-User-Email: $USER_EMAIL" \
                -H "X-User-Session-Id: $SESSION_ID" \
                -H "X-Content-SHA256: $BODY_SHA256" \
                -H "X-Internal-Gateway-Token: $GW_TOKEN" \
                -o "$OUT_FILE"
            fi
          }

          JAR_PATRIMOINE=$(find_jar ms-patrimoine)
          JAR_CIRCUIT=$(find_jar ms-circuit)
          JAR_EVENEMENT=$(find_jar ms-evenement)
          JAR_RESERVATION=$(find_jar ms-reservation)

          if [ -z "$JAR_PATRIMOINE" ] || [ -z "$JAR_CIRCUIT" ] || [ -z "$JAR_EVENEMENT" ] || [ -z "$JAR_RESERVATION" ]; then
            echo "[ERREUR] Artefact JAR introuvable pour l'un des 4 microservices !" >&2
            exit 1
          fi

          echo "=== Démarrage des 4 microservices ==="
          java -jar "$JAR_PATRIMOINE" --spring.cloud.discovery.enabled=false > patrimoine.log 2>&1 &
          PID_PATRIMOINE=$!
          PIDS+=("$PID_PATRIMOINE")

          java -jar "$JAR_CIRCUIT" --spring.cloud.discovery.enabled=false > circuit.log 2>&1 &
          PID_CIRCUIT=$!
          PIDS+=("$PID_CIRCUIT")

          java -jar "$JAR_EVENEMENT" --spring.cloud.discovery.enabled=false > evenement.log 2>&1 &
          PID_EVENEMENT=$!
          PIDS+=("$PID_EVENEMENT")

          java -jar "$JAR_RESERVATION" --spring.cloud.discovery.enabled=false > reservation.log 2>&1 &
          PID_RESERVATION=$!
          PIDS+=("$PID_RESERVATION")

          wait_for_service "ms-patrimoine" 3001 "$PID_PATRIMOINE"
          wait_for_service "ms-circuit" 3002 "$PID_CIRCUIT"
          wait_for_service "ms-evenement" 3003 "$PID_EVENEMENT"
          wait_for_service "ms-reservation" 3004 "$PID_RESERVATION"

          echo -e "\n=================================================================="
          echo " EXÉCUTION DES TESTS FONCTIONNELS ET DE SÉCURITÉ ZERO-TRUST"
          echo "=================================================================="

          echo "0. Vérification du rejet des accès directs sans enveloppe signée (:3001 -> 401)"
          DIRECT_CODE=$(curl -s -w "%{http_code}" -o /tmp/resp_direct.json "http://localhost:3001/api/patrimoines")
          if [ "$DIRECT_CODE" != "401" ]; then
            echo "[ÉCHEC SÉCURITÉ] Accès direct non signé a retourné HTTP $DIRECT_CODE (attendu: 401)" >&2
            exit 1
          fi
          echo ">>> Succès : Accès direct non authentifié rejeté avec HTTP 401."

          echo -e "\n1. Vérification des patrimoines initiaux (:3001)"
          HTTP_CODE=$(gateway_signed_curl "GET" "http://localhost:3001/api/patrimoines" "/api/patrimoines" "ANONYMOUS" "PUBLIC" "" "" "" "/tmp/resp_patrimoines.json")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "[ÉCHEC] GET /api/patrimoines a retourné HTTP $HTTP_CODE (attendu: 200)" >&2
            cat /tmp/resp_patrimoines.json >&2
            dump_diagnostics "Vérification des patrimoines initiaux"
            exit 1
          fi
          PAT_COUNT=$(jq '. | length' /tmp/resp_patrimoines.json 2>/dev/null || echo 0)
          PAT_FOUND=$(jq -r '.[] | select(.codePatrimoine == "PAT-ZIG-001") | .nomPatrimoine' /tmp/resp_patrimoines.json 2>/dev/null || true)
          if [ "$PAT_COUNT" -lt 6 ] || [ -z "$PAT_FOUND" ]; then
            echo "[ÉCHEC] Données patrimoniales incomplètes : count=$PAT_COUNT, PAT-ZIG-001=$PAT_FOUND" >&2
            cat /tmp/resp_patrimoines.json >&2
            dump_diagnostics "Vérification des patrimoines initiaux"
            exit 1
          fi
          echo ">>> Succès : $PAT_COUNT patrimoines détectés, premier site : '$PAT_FOUND' (PAT-ZIG-001)."

          echo -e "\n2. Vérification des 3 modes de communication TP2 signés HMAC (:3002 -> :3001)"
          # 2a. OpenFeign
          HTTP_CODE=$(gateway_signed_curl "GET" "http://localhost:3002/api/circuits/communication/feign/patrimoines/1" "/api/circuits/communication/feign/patrimoines/1" "ANONYMOUS" "PUBLIC" "" "" "" "/tmp/resp_feign.json")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "[ÉCHEC] Communication Feign : HTTP $HTTP_CODE" >&2
            cat /tmp/resp_feign.json >&2
            dump_diagnostics "Communication Feign (:3002 -> :3001)"
            exit 1
          fi
          CLIENT_FEIGN=$(jq -r '.clientUtilise // empty' /tmp/resp_feign.json 2>/dev/null)
          if [ "$CLIENT_FEIGN" != "FEIGN" ]; then
            echo "[ÉCHEC] Communication Feign : clientUtilise='$CLIENT_FEIGN' (attendu: FEIGN)" >&2
            cat /tmp/resp_feign.json >&2
            dump_diagnostics "Communication Feign"
            exit 1
          fi
          echo "  [2a. OpenFeign] Succès : clientUtilise=FEIGN, patrimoineId=1"

          # 2b. RestTemplate
          HTTP_CODE=$(gateway_signed_curl "GET" "http://localhost:3002/api/circuits/communication/resttemplate/patrimoines/2" "/api/circuits/communication/resttemplate/patrimoines/2" "ANONYMOUS" "PUBLIC" "" "" "" "/tmp/resp_rest.json")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "[ÉCHEC] Communication RestTemplate : HTTP $HTTP_CODE" >&2
            cat /tmp/resp_rest.json >&2
            dump_diagnostics "Communication RestTemplate (:3002 -> :3001)"
            exit 1
          fi
          CLIENT_REST=$(jq -r '.clientUtilise // empty' /tmp/resp_rest.json 2>/dev/null)
          if [ "$CLIENT_REST" != "RESTTEMPLATE" ]; then
            echo "[ÉCHEC] Communication RestTemplate : clientUtilise='$CLIENT_REST' (attendu: RESTTEMPLATE)" >&2
            cat /tmp/resp_rest.json >&2
            dump_diagnostics "Communication RestTemplate"
            exit 1
          fi
          echo "  [2b. RestTemplate] Succès : clientUtilise=RESTTEMPLATE, patrimoineId=2"

          # 2c. WebClient
          HTTP_CODE=$(gateway_signed_curl "GET" "http://localhost:3002/api/circuits/communication/webclient/patrimoines/3" "/api/circuits/communication/webclient/patrimoines/3" "ANONYMOUS" "PUBLIC" "" "" "" "/tmp/resp_webclient.json")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "[ÉCHEC] Communication WebClient : HTTP $HTTP_CODE" >&2
            cat /tmp/resp_webclient.json >&2
            dump_diagnostics "Communication WebClient (:3002 -> :3001)"
            exit 1
          fi
          CLIENT_WEB=$(jq -r '.clientUtilise // empty' /tmp/resp_webclient.json 2>/dev/null)
          if [ "$CLIENT_WEB" != "WEBCLIENT" ]; then
            echo "[ÉCHEC] Communication WebClient : clientUtilise='$CLIENT_WEB' (attendu: WEBCLIENT)" >&2
            cat /tmp/resp_webclient.json >&2
            dump_diagnostics "Communication WebClient"
            exit 1
          fi
          echo "  [2c. WebClient] Succès : clientUtilise=WEBCLIENT, patrimoineId=3"

          echo -e "\n3. Création d'un circuit via OpenFeign (:3002 -> :3001)"
          CIRCUIT_PAYLOAD='{"nomCircuit":"Circuit CI","descriptionCircuit":"Test E2E","difficulte":"FACILE","placesMax":20,"prix":5000.0,"etapes":[{"ordre":1,"dureeVisite":60,"patrimoineId":1},{"ordre":2,"dureeVisite":45,"patrimoineId":2}]}'
          HTTP_CODE=$(gateway_signed_curl "POST" "http://localhost:3002/api/circuits" "/api/circuits" "3" "GESTIONNAIRE_SITE" "CIRCUIT:CREER,CIRCUIT:PUBLIER,CIRCUIT:LIRE" "awa.sagna@zig.univ.sn" "$CIRCUIT_PAYLOAD" "/tmp/resp_circuit.json")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "[ÉCHEC] POST /api/circuits a retourné HTTP $HTTP_CODE (attendu: 200 ou 201)" >&2
            cat /tmp/resp_circuit.json >&2
            dump_diagnostics "Création de circuit via OpenFeign"
            exit 1
          fi
          DUREE=$(jq -r '.dureeEstimee // empty' /tmp/resp_circuit.json 2>/dev/null)
          CIRCUIT_ID=$(jq -r '.id // empty' /tmp/resp_circuit.json 2>/dev/null)
          if [ "$DUREE" != "105" ]; then
            echo "[ÉCHEC] Durée estimée incorrecte : '$DUREE' (attendu: 105)" >&2
            cat /tmp/resp_circuit.json >&2
            dump_diagnostics "Création de circuit - vérification durée"
            exit 1
          fi
          echo ">>> Succès : Circuit créé avec id=$CIRCUIT_ID, dureeEstimee=105 min (60min + 45min)."

          echo -e "\n4. Création d'une réservation vérifiant la disponibilité du circuit (:3004 -> :3002)"
          TARGET_CIRCUIT_ID="${CIRCUIT_ID:-1}"
          RESA_PAYLOAD="{\"nomClient\":\"Test CI\",\"emailClient\":\"ci@zig.univ.sn\",\"nombrePlaces\":4,\"typeReservation\":\"CIRCUIT\",\"circuitId\":$TARGET_CIRCUIT_ID}"
          HTTP_CODE=$(gateway_signed_curl "POST" "http://localhost:3004/api/reservations" "/api/reservations" "2" "TOURISTE" "RESERVATION:CREER,RESERVATION:LIRE_PROPRE" "ci@zig.univ.sn" "$RESA_PAYLOAD" "/tmp/resp_reservation.json")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "[ÉCHEC] POST /api/reservations a retourné HTTP $HTTP_CODE (attendu: 200 ou 201)" >&2
            cat /tmp/resp_reservation.json >&2
            dump_diagnostics "Création de réservation"
            exit 1
          fi
          MONTANT=$(jq -r '.montantTotal // empty' /tmp/resp_reservation.json 2>/dev/null)
          RESA_ID=$(jq -r '.id // empty' /tmp/resp_reservation.json 2>/dev/null)
          if [ "$MONTANT" != "20000.0" ] && [ "$MONTANT" != "20000" ]; then
            echo "[ÉCHEC] Montant total incorrect : '$MONTANT' (attendu: 20000.0)" >&2
            cat /tmp/resp_reservation.json >&2
            dump_diagnostics "Création de réservation - vérification montant"
            exit 1
          fi
          echo ">>> Succès : Réservation créée avec id=$RESA_ID, montantTotal=$MONTANT (4 places x 5000.0 FCFA)."

          echo -e "\n=================================================================="
          echo " SUCCÈS COMPLET : Tous les tests d'intégration E2E ont réussi !"
          echo "=================================================================="

      - name: Conservation des journaux et captures E2E
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-integration-e2e
          path: |
            *.log
            /tmp/resp_*.json
          if-no-files-found: ignore

  # =========================================================================
  # 3. DÉPLOIEMENT CONTINU : Validation et Build des Images Docker (TP3)
  #    S'exécute sur push ET sur Pull Request ciblant deploy ou main
  # =========================================================================
  docker-build:
    name: Build Docker Images (TP3)
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-e2e]
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/deploy' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'deploy'))

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Téléchargement des JARs compilés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Placement des JARs dans les dossiers target/ et construction des images Docker
        run: |
          for s in discovery-server ms-patrimoine ms-circuit ms-evenement ms-reservation ms-utilisateur ms-notification ms-paiement api-gateway; do
            mkdir -p "$s/target"
            cp artifacts/jar-$s/*.jar "$s/target/"
          done
          cp .env.example .env
          docker compose --env-file .env config -q
          docker build -t fatylamine/patrimoines:v1 ./ms-patrimoine
          docker build -t fatylamine/circuits:v1 ./ms-circuit
          docker build -t fatylamine/evenements:v1 ./ms-evenement
          docker build -t fatylamine/reservations:v1 ./ms-reservation
          docker images | grep fatylamine

  # =========================================================================
  # 4. STATUT GLOBAL DE VALIDATION DE LA PULL REQUEST (Status Check unique)
  # =========================================================================
  pr-validation-gate:
    name: Validation Finale PR (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-e2e]
    if: always()
    steps:
      - name: Vérification du statut des jobs obligatoires
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.integration-e2e.result }}" != "success" ]; then
            echo "Échec des conditions d'intégration : la Pull Request ne peut pas être fusionnée."
            exit 1
          fi
          echo "Toutes les conditions d'intégration de la Pull Request sont validées !"
