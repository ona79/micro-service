          fi

          IDEM_NOTIF_BODY='{"destinataire":"idem.ci@zig.univ.sn","utilisateurId":4,"sujet":"Test idempotence P05","contenu":"Vérification anti-doublon CI E2E","canal":"EMAIL","typeEvenement":"AVIS_MODERE","idempotencyKey":"ci-p05-idem-001"}'
          gateway_signed_curl "POST" "http://localhost:3007/api/notifications" "/api/notifications" "1" "ADMINISTRATEUR" "NOTIFICATION:LIRE_TOUT,NOTIFICATION:RELANCER" "admin@zig.univ.sn" "$IDEM_NOTIF_BODY" "/tmp/resp_notif_idem1.json" >/dev/null
          gateway_signed_curl "POST" "http://localhost:3007/api/notifications" "/api/notifications" "1" "ADMINISTRATEUR" "NOTIFICATION:LIRE_TOUT,NOTIFICATION:RELANCER" "admin@zig.univ.sn" "$IDEM_NOTIF_BODY" "/tmp/resp_notif_idem2.json" >/dev/null
          N_ID1=$(jq -r '.id // empty' /tmp/resp_notif_idem1.json)
          N_ID2=$(jq -r '.id // empty' /tmp/resp_notif_idem2.json)
          if [ -z "$N_ID1" ] || [ "$N_ID1" != "$N_ID2" ]; then
            echo "[ÉCHEC] Idempotence notification défaillante : id1='$N_ID1', id2='$N_ID2'" >&2
            exit 1
          fi

          HTTP_CODE=$(gateway_signed_curl "POST" "http://localhost:3005/api/guides/$GUIDE_PROFIL_ID/suspendre" "/api/guides/$GUIDE_PROFIL_ID/suspendre" "1" "ADMINISTRATEUR" "GUIDE:SUSPENDRE,GUIDE:VALIDER" "admin@zig.univ.sn" '{"motif":"Suspension test E2E"}' "/tmp/resp_guide_susp.json")
          if [ "$HTTP_CODE" != "200" ] || ! jq -e '.statutValidation == "SUSPENDU"' /tmp/resp_guide_susp.json >/dev/null 2>&1; then
            echo "[ÉCHEC] Suspension guide échouée : HTTP $HTTP_CODE" >&2
            exit 1
          fi
          REASSIGN_CODE=$(gateway_signed_curl "PATCH" "http://localhost:3002/api/circuits/$TARGET_CIRCUIT_ID/guide" "/api/circuits/$TARGET_CIRCUIT_ID/guide" "1" "ADMINISTRATEUR" "CIRCUIT:MODIFIER" "admin@zig.univ.sn" "$ASSIGN_BODY" "/tmp/resp_circuit_guide_susp.json")
          if [ "$REASSIGN_CODE" != "400" ]; then
            echo "[ÉCHEC] Affectation d'un guide suspendu devait retourner 400, reçu HTTP $REASSIGN_CODE" >&2
            cat /tmp/resp_circuit_guide_susp.json >&2
            exit 1
          fi
          echo ">>> Succès : Inbox BOLA (403 -> 200 lu), idempotence ($N_ID1 == $N_ID2) et blocage guide suspendu validés."

          echo -e "\n=================================================================="
          echo " SUCCÈS COMPLET : Tous les tests d'intégration E2E P05 ont réussi !"
          echo "=================================================================="

      - name: Conservation des journaux et captures E2E
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-integration-e2e
          path: |
            *.log
            /tmp/resp_*.json
          if-no-files-found: ignore

  # =========================================================================
  # 3. DÉPLOIEMENT CONTINU : Validation et Build des Images Docker (TP3)
  #    S'exécute sur push ET sur Pull Request ciblant deploy ou main
  # =========================================================================
  docker-build:
    name: Build Docker Images (TP3)
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-test-and-build, integration-e2e]
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/deploy' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'deploy'))

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Téléchargement des JARs compilés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Placement des JARs dans les dossiers target/ et construction des images Docker
        run: |
          for s in discovery-server ms-patrimoine ms-circuit ms-evenement ms-reservation ms-utilisateur ms-notification ms-paiement api-gateway; do
            mkdir -p "$s/target"
            cp artifacts/jar-$s/*.jar "$s/target/"
          done
          cp .env.example .env
          docker compose --env-file .env config -q
          docker build -t fatylamine/patrimoines:v1 ./ms-patrimoine
          docker build -t fatylamine/circuits:v1 ./ms-circuit
          docker build -t fatylamine/evenements:v1 ./ms-evenement
          docker build -t fatylamine/reservations:v1 ./ms-reservation
          docker build -t fatylamine/paiements:v1 ./ms-paiement
          docker build -t fatylamine/utilisateurs:v1 ./ms-utilisateur
          docker build -t fatylamine/notifications:v1 ./ms-notification
          docker build -t fatylamine/api-gateway:v1 ./api-gateway
          docker build -t fatylamine/discovery-server:v1 ./discovery-server
          docker images | grep fatylamine

  # =========================================================================
  # 4. STATUT GLOBAL DE VALIDATION DE LA PULL REQUEST (Status Check unique)
  # =========================================================================
  pr-validation-gate:
    name: Validation Finale PR (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-test-and-build, integration-e2e]
    if: always()
    steps:
      - name: Vérification du statut des jobs obligatoires
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.frontend-test-and-build.result }}" != "success" ] || [ "${{ needs.integration-e2e.result }}" != "success" ]; then
            echo "Échec des conditions d'intégration : la Pull Request ne peut pas être fusionnée."
            exit 1
          fi
          echo "Toutes les conditions d'intégration de la Pull Request sont validées !"
