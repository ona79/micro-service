services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-postgres.sh:/docker-entrypoint-initdb.d/init-multi-postgres.sh:ro
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-server:
    build: ./discovery-server
    image: fatylamine/discovery-server:v1
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - internal-net
      - public-net

  ms-patrimoine:
    build: ./ms-patrimoine
    image: fatylamine/patrimoines:v1
    container_name: ms-patrimoine
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=patrimoine_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  ms-circuit:
    build: ./ms-circuit
    image: fatylamine/circuits:v1
    container_name: ms-circuit
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=circuit_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PATRIMOINE_URL=http://ms-patrimoine:3001
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      ms-patrimoine:
        condition: service_started
      discovery-server:
        condition: service_started

  ms-evenement:
    build: ./ms-evenement
    image: fatylamine/evenements:v1
    container_name: ms-evenement
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=evenement_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PATRIMOINE_URL=http://ms-patrimoine:3001
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      ms-patrimoine:
        condition: service_started
      discovery-server:
        condition: service_started

  ms-reservation:
    build: ./ms-reservation
    image: fatylamine/reservations:v1
    container_name: ms-reservation
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=reservation_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CIRCUIT_URL=http://ms-circuit:3002
      - EVENEMENT_URL=http://ms-evenement:3003
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      ms-circuit:
        condition: service_started
      ms-evenement:
        condition: service_started
      discovery-server:
        condition: service_started

  ms-utilisateur:
    build: ./ms-utilisateur
    image: fatylamine/utilisateurs:v1
    container_name: ms-utilisateur
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=utilisateur_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  ms-notification:
    build: ./ms-notification
    image: fatylamine/notifications:v1
    container_name: ms-notification
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=notification_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  ms-paiement:
    build: ./ms-paiement
    image: fatylamine/paiements:v1
    container_name: ms-paiement
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paiement_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RESERVATION_URL=http://ms-reservation:3004
      - NOTIFICATION_URL=http://ms-notification:3007
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      ms-reservation:
        condition: service_started
      ms-notification:
        condition: service_started
      discovery-server:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    image: fatylamine/api-gateway:v1
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - PATRIMOINE_URL=http://ms-patrimoine:3001
      - CIRCUIT_URL=http://ms-circuit:3002
      - EVENEMENT_URL=http://ms-evenement:3003
      - RESERVATION_URL=http://ms-reservation:3004
      - UTILISATEUR_URL=http://ms-utilisateur:3005
      - PAIEMENT_URL=http://ms-paiement:3006
      - NOTIFICATION_URL=http://ms-notification:3007
      - EUREKA_URI=http://discovery-server:8761/eureka
    networks:
      - internal-net
      - public-net
    depends_on:
      - ms-patrimoine
      - ms-circuit
      - ms-evenement
      - ms-reservation
      - ms-utilisateur
      - ms-paiement
      - ms-notification

  frontend-angular:
    build: ./frontend-angular
    image: fatylamine/frontend-angular:v1
    container_name: frontend-angular
    ports:
      - "80:80"
    networks:
      - internal-net
      - public-net
    depends_on:
      - api-gateway

networks:
  internal-net:
    driver: bridge
  public-net:
    driver: bridge

volumes:
  postgres-data:
