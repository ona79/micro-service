server:
  port: 3004

spring:
  application:
    name: reservation
  datasource:
    url: 'jdbc:h2:mem:reservationdb'
  h2:
    console:
      enabled: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: '*'

circuit:
  url: http://localhost:3002
evenement:
  url: http://localhost:3003


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
