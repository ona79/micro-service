server:
  port: ${PORT:8090}

spring:
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-patrimoine
              uri: ${PATRIMOINE_URL:lb://ms-patrimoine}
              predicates:
                - Path=/api/patrimoines/**
            - id: ms-circuit
              uri: ${CIRCUIT_URL:lb://ms-circuit}
              predicates:
                - Path=/api/circuits/**
            - id: ms-evenement
              uri: ${EVENEMENT_URL:lb://ms-evenement}
              predicates:
                - Path=/api/evenements/**
            - id: ms-reservation
              uri: ${RESERVATION_URL:lb://ms-reservation}
              predicates:
                - Path=/api/reservations/**
            - id: ms-utilisateur
              uri: ${UTILISATEUR_URL:lb://ms-utilisateur}
              predicates:
                - Path=/api/utilisateurs/**
            - id: ms-paiement
              uri: ${PAIEMENT_URL:lb://ms-paiement}
              predicates:
                - Path=/api/paiements/**
            - id: ms-notification
              uri: ${NOTIFICATION_URL:lb://ms-notification}
              predicates:
                - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'
  endpoint:
    health:
      show-details: when_authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

security:
  session:
    secret: ${SECURITY_SESSION_SECRET:dev-secret-key-patrimoine-casamance-uasz-32bytes!}

---
# Profil PROD : Secrets obligatoires et Actuator durci
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'

security:
  session:
    secret: ${SECURITY_SESSION_SECRET:?Variable obligatoire SECURITY_SESSION_SECRET manquante pour la production (min 32 octets)}
