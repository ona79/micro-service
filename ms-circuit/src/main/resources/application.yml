server:
  port: 3002

spring:
  application:
    name: ms-circuit
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'
  endpoint:
    health:
      show-details: when_authorized

patrimoine:
  url: ${PATRIMOINE_URL:http://localhost:3001}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

---
# Profil DEV : H2 en mémoire pour le développement local
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:circuitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

---
# Profil TEST : H2 en mémoire pour les tests unitaires et intégration CI
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:circuitdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

---
# Profil PROD : PostgreSQL avec migrations Flyway et validation Hibernate
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:circuit_db}
    username: ${DB_USER:circuit_user}
    password: ${DB_PASSWORD:?Variable obligatoire DB_PASSWORD non definie}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'
