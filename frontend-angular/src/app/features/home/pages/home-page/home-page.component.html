<app-home-hero-section
  [patrimoinesCount]="publishedPatrimoines().length"
  [circuitsCount]="publishedCircuits().length"
  [evenementsCount]="upcomingEvenements().length"
  [guidesCount]="totalGuidesCount()"
  (searchSubmit)="submitHeroSearch($event)"
/>

<app-home-terroirs-section [zones]="zones" />

<app-home-patrimoines-section
  [patrimoines]="featuredPatrimoines()"
  [loading]="patrimoineStore.loading()"
  [error]="patrimoineStore.error()"
  [avisMap]="patrimoineAvisMap()"
  (retry)="reloadPatrimoines()"
/>

<app-home-circuits-section
  [circuits]="featuredCircuits()"
  [avisMap]="circuitAvisMap()"
/>

<app-home-evenements-section [evenements]="featuredEvenements()" />

<app-home-guides-section [guides]="featuredGuides()" />

<app-home-cta-banner-section />
